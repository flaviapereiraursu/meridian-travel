<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca de Passagens</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .container {
            background-color: #0066cc;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            color: white;
            margin: auto;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-weight: bold;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
        }
        .btn {
            background-color: orange;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }
        .dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            color: black;
            min-width: 250px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
            border-radius: 5px;
            padding: 10px;
        }
        .dropdown-content div {
            margin-bottom: 10px;
        }
        .dropdown-content button {
            width: 100%;
            background-color: #0066cc;
            color: white;
            padding: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Passagens aéreas</h2>
        
        <div class="input-group">
            <label>Origem</label>
            <input type="text" placeholder="Washington, D.C.">
        </div>

        <div class="input-group">
            <label>Destino</label>
            <input type="text" placeholder="Insira sua cidade">
        </div>

        <div class="input-group">
            <label>Datas</label>
            <input type="date"> - <input type="date">
        </div>

        <div class="dropdown">
            <label>Passageiros e Classe</label>
            <div class="dropdown-content">
                <div>
                    <label>Maiores (a partir de 18 anos)</label>
                    <input type="number" min="1" value="1">
                </div>
                <div>
                    <label>Menores (até 17 anos)</label>
                    <input type="number" min="0" value="0">
                </div>
                <div>
                    <label>Classe</label>
                    <select>
                        <option>Econômica</option>
                        <option>Executiva</option>
                        <option>Primeira Classe</option>
                    </select>
                </div>
                <button>Aplicar</button>
            </div>
        </div>

        <button class="btn">Buscar</button>
    </div>

</body>
</html>
