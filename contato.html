<section class="contato">
    <div class="container">
        <div class="row">
            <div class="col-md-6 imagem">
                <img src="Assets/contato.jpeg" alt="Imagem de contato">
            </div>
            <div class="col-md-6 formulario">
                <h2 class="text-center">Entre em Contato</h2>
                <p class="text-center">Preencha o formulário abaixo e nossa equipe entrará em contato com você.</p>
                <form>
                    <div class="form-group">
                        <label for="nome">Nome:</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome" required>
                    </div>
                    <div class="form-group">
                        <label for="email">E-mail:</label>
                        <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail" required>
                    </div>
                    <div class="form-group">
                        <label for="mensagem">Mensagem:</label>
                        <textarea class="form-control" id="mensagem" rows="4" placeholder="Digite sua mensagem"
                            required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Bootstrap JS e dependências -->
<script>
    const track = document.querySelector('.carousel-track');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    let index = 0;
    const cardWidth = document.querySelector('.card').offsetWidth + 20;

    nextBtn.addEventListener('click', () => {
        if (index < track.children.length - 3) {
            index++;
            track.style.transform = `translateX(-${index * cardWidth}px)`;
        }
    });

    prevBtn.addEventListener('click', () => {
        if (index > 0) {
            index--;
            track.style.transform = `translateX(-${index * cardWidth}px)`;
        }
    });

    function irParaPacotes() {
        window.location.href = "pacotes.html";
    }
    
    function irParaDestinos() {
        window.location.href = "destinos.html";
    }

    document.querySelectorAll('.card-passagens').forEach(card => {
        card.addEventListener('click', () => {
            window.location.href = "passagens.html";
        });
    });

    document.querySelectorAll('.cards').forEach(card => {
        card.addEventListener('click', () => {
            window.location.href = "destinos.html";
        });
    });

</script>
